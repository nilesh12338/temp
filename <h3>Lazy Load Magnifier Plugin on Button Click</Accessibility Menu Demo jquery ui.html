<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Accessibility Menu Demo</title>

<link rel="stylesheet"
href="https://code.jquery.com/ui/1.14.2/themes/base/jquery-ui.css">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://code.jquery.com/ui/1.14.2/jquery-ui.min.js"></script>

<style>

body{
    font-family:Arial;
    margin:60px;
    background:#f5f5f5;
}

/* Main Widget */

.accessibilityWidget{
    position:relative;
    display:inline-block;
}

/* Button */

.widgetButton{

    width:48px;
    height:48px;

    border-radius:50%;

    background:#0d6efd;

    color:#fff;

    text-align:center;

    line-height:48px;

    font-size:24px;

    cursor:pointer;

    user-select:none;

    box-shadow:0 2px 8px rgba(0,0,0,.25);
}

/* Main Menu */

.menu{

    display:none;

    position:absolute;

    top:55px;

    left:0;

    width:240px;

    background:#fff;

    border:1px solid #dcdcdc;

    border-radius:6px;

    list-style:none;

    padding:5px 0;

    margin:0;

    box-shadow:0 5px 18px rgba(0,0,0,.2);

    z-index:9999;
}

.menu>li{

    position:relative;

    padding:12px 15px;

    cursor:pointer;

    white-space:nowrap;

    transition:.2s;
}

.menu>li:hover{

    background:#e9ecef;
}

/* Sub Menu */

.subMenu{

    display:none;

    position:absolute;

    left:100%;

    top:-1px;

    width:180px;

    background:#fff;

    border:1px solid #dcdcdc;

    border-radius:6px;

    list-style:none;

    padding:5px 0;

    margin:0;

    box-shadow:0 5px 18px rgba(0,0,0,.2);
}

.subMenu li{

    padding:12px 15px;

    cursor:pointer;
}

.subMenu li:hover{

    background:#e9ecef;
}

.arrow{

    float:right;

    font-size:12px;
}

/* Icons */

.icon{

    display:inline-block;

    width:25px;
}

/* jQuery animation */

.menuOpen{

    display:block;
}

.subOpen{

    display:block;
}

</style>

</head>

<body>

<h2>Accessibility Widget Demo</h2>

<div class="accessibilityWidget">

    <div class="widgetButton"
         title="Accessibility">

        ♿

    </div>

    <ul class="menu">

        <li id="magnifier">

            <span class="icon">🔍</span>

            Magnifier

        </li>

        <li id="speech">

            <span class="icon">🔊</span>

            Text To Speech

        </li>

        <li class="fontResize">

            <span class="icon">🔠</span>

            Font Resize

            <span class="arrow">▶</span>

            <ul class="subMenu">

                <li data-size="A">A</li>

                <li data-size="AA">A+</li>

                <li data-size="AAA">A++</li>

            </ul>

        </li>

    </ul>

</div>

<script>

$(function(){

    /* Show Menu */

    $(".accessibilityWidget").mouseenter(function(){

        $(".menu").stop(true,true).fadeIn(150);

    });

    /* Hide Menu */

    $(".accessibilityWidget").mouseleave(function(){

        $(".menu").stop(true,true).fadeOut(150);

        $(".subMenu").hide();

    });

    /* Sub Menu */

    $(".fontResize").mouseenter(function(){

        $(this).children(".subMenu")
               .stop(true,true)
               .fadeIn(150);

    });

    $(".fontResize").mouseleave(function(){

        $(this).children(".subMenu")
               .stop(true,true)
               .fadeOut(150);

    });

    /* Click Events */

    $("#magnifier").click(function(){

        alert("Magnifier Clicked");

    });

    $("#speech").click(function(){

        alert("Text To Speech Clicked");

    });

    $(".subMenu li").click(function(){

        var size=$(this).data("size");

        alert("Font Resize : "+size);

        //fontResizer(this,size);

    });

});

</script>

</body>
</html>

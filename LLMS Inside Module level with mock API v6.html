<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascading AJAX MultiSelect Dropdowns with Cards</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background-color: #f4f5f7;
            padding: 30px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .dropdown-wrapper { position: relative; width: 100%; }

        /* Dropdown Styling */
        .custom-multiselect-btn {
            background-color: #ffffff;
            border: 1px solid #ced4da;
            border-radius: 4px;
            padding: 6px 12px;
            width: 100%;
            text-align: left;
            font-size: 0.85rem;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .custom-multiselect-btn:focus {
            border-color: #86b7fe; box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25); outline: 0;
        }
        .custom-multiselect-btn:disabled {
            background-color: #e9ecef; cursor: not-allowed; color: #6c757d;
        }

        .custom-multiselect-menu {
            position: absolute; top: 100%; left: 0; z-index: 1050; width: 100%; min-width: 280px;
            background-color: #ffffff; border: 1px solid #c5c5c5; border-radius: 2px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); margin-top: 2px; display: none;
            max-height: 400px; overflow-y: auto;
        }
        .custom-multiselect-menu.show { display: block; }

        .multiselect-header-bar {
            background-color: #e9ecef; border-bottom: 1px solid #ced4da; padding: 6px 10px;
            display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem;
            position: sticky; top: 0; z-index: 10;
        }
        .header-actions { display: flex; gap: 12px; }
        .header-action-btn { color: #333; text-decoration: none; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .header-action-btn:hover { color: #000; }
        .close-dropdown-btn { color: #666; cursor: pointer; font-size: 1rem; line-height: 1; }

        .group-header {
            background-color: #f1f3f5; padding: 6px 10px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid #e2e6ea; border-top: 1px solid #e2e6ea;
            font-weight: 700; font-size: 0.85rem; color: #212529; user-select: none;
        }
        .group-header label { cursor: pointer; display: flex; align-items: center; gap: 8px; margin: 0; flex-grow: 1; }
        .collapse-toggle { cursor: pointer; color: #495057; font-size: 0.9rem; padding: 0 4px; }

        .group-items { list-style: none; padding: 0; margin: 0; }
        .group-items li.flat-item { padding: 4px 10px 4px 28px; }
        .group-items li.flat-item:hover { background-color: #f8f9fa; }
        .group-items label { cursor: pointer; display: flex; align-items: center; gap: 8px; margin: 0; font-size: 0.85rem; color: #333; width: 100%; }
        .form-check-input { cursor: pointer; margin: 0; }

        /* ========================================= */
        /* DASHBOARD CARDS STYLING                   */
        /* ========================================= */
        .dash-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #e9ecef;
            border-top-width: 4px;
            height: 100%;
        }

        .dash-card-header {
            padding: 12px 16px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        /* Toggle Buttons (Created / Approved) */
        .dash-toggle-container {
            display: flex;
            margin: 0 16px 16px 16px;
            background: #f8f9fa;
            border-radius: 4px;
            overflow: hidden;
        }
        .dash-toggle-btn {
            flex: 1; text-align: center; padding: 8px; font-size: 0.8rem; font-weight: 600;
            border: none; background: transparent; color: #6c757d; cursor: pointer; transition: 0.2s;
        }

        /* Tables */
        .dash-table { width: 100%; font-size: 0.8rem; text-align: right; }
        .dash-table th, .dash-table td { padding: 8px 16px; }
        .dash-table th:first-child, .dash-table td:first-child { text-align: left; }
        .dash-table th { font-weight: 600; color: #fff; }
        .dash-table tbody tr:nth-child(even) { background-color: #f8f9fa; }
        .dash-table tfoot { font-weight: 700; background-color: #f1f3f5; }

        /* Theme Colors */
        .theme-blue { border-top-color: #5b8dec; }
        .theme-blue .dash-card-header { color: #5b8dec; }
        .theme-blue .dash-toggle-btn.active { background-color: #5b8dec; color: #fff; }
        .theme-blue .dash-table th { background-color: #5b8dec; }
        .theme-blue .dash-table tfoot td { color: #5b8dec; }

        .theme-purple { border-top-color: #7b4397; }
        .theme-purple .dash-card-header { color: #7b4397; }
        .theme-purple .dash-toggle-btn.active { background-color: #7b4397; color: #fff; }
        .theme-purple .dash-table th { background-color: #7b4397; }
        .theme-purple .dash-table tfoot td { color: #7b4397; }

        .theme-orange { border-top-color: #e67e22; }
        .theme-orange .dash-card-header { color: #e67e22; }
        .theme-orange .dash-toggle-btn.active { background-color: #e67e22; color: #fff; }
        .theme-orange .dash-table th { background-color: #e67e22; }
        .theme-orange .dash-table tfoot td { color: #e67e22; }

        .theme-dark { border-top-color: #343a40; }
        .theme-dark .dash-card-header { color: #343a40; }
        .theme-dark .dash-toggle-btn.active { background-color: #343a40; color: #fff; }
        .theme-dark .dash-table th { background-color: #343a40; }
        .theme-dark .dash-table tfoot td { color: #343a40; }

    </style>
</head>
<body>

    <div class="container-fluid">
        
        <div class="row g-2 mb-3">
            <div class="col-md">
                <div class="dropdown-wrapper" id="dd-business-group">
                    <label class="form-label text-muted mb-1 small">Business Group</label>
                    <button type="button" class="custom-multiselect-btn trigger-btn">
                        <span class="selected-text">Select</span><i class="bi bi-chevron-down ms-2"></i>
                    </button>
                    <div class="custom-multiselect-menu">
                        <div class="multiselect-header-bar">
                            <div class="header-actions">
                                <span class="header-action-btn btn-check-all"><i class="bi bi-check-lg"></i> Check all</span>
                                <span class="header-action-btn btn-uncheck-all"><i class="bi bi-x-lg"></i> Uncheck all</span>
                            </div>
                            <i class="bi bi-x-circle-fill close-dropdown-btn"></i>
                        </div>
                        <div class="dynamic-container"><div class="p-3 text-center text-muted"><div class="spinner-border spinner-border-sm me-2"></div> Loading...</div></div>
                    </div>
                </div>
            </div>

            <div class="col-md">
                <div class="dropdown-wrapper" id="dd-circle">
                    <label class="form-label text-muted mb-1 small">Circle</label>
                    <button type="button" class="custom-multiselect-btn trigger-btn" disabled>
                        <span class="selected-text">Select Item(s)</span><i class="bi bi-chevron-down ms-2"></i>
                    </button>
                    <div class="custom-multiselect-menu">
                        <div class="multiselect-header-bar">
                            <div class="header-actions"><span class="header-action-btn btn-check-all"><i class="bi bi-check-lg"></i> Check all</span><span class="header-action-btn btn-uncheck-all"><i class="bi bi-x-lg"></i> Uncheck all</span></div><i class="bi bi-x-circle-fill close-dropdown-btn"></i>
                        </div>
                        <div class="dynamic-container"></div>
                    </div>
                </div>
            </div>

            <div class="col-md">
                <div class="dropdown-wrapper" id="dd-network">
                    <label class="form-label text-muted mb-1 small">Network</label>
                    <button type="button" class="custom-multiselect-btn trigger-btn" disabled>
                        <span class="selected-text">Select Item(s)</span><i class="bi bi-chevron-down ms-2"></i>
                    </button>
                    <div class="custom-multiselect-menu">
                        <div class="multiselect-header-bar">
                            <div class="header-actions"><span class="header-action-btn btn-check-all"><i class="bi bi-check-lg"></i> Check all</span><span class="header-action-btn btn-uncheck-all"><i class="bi bi-x-lg"></i> Uncheck all</span></div><i class="bi bi-x-circle-fill close-dropdown-btn"></i>
                        </div>
                        <div class="dynamic-container"></div>
                    </div>
                </div>
            </div>

            <div class="col-md">
                <div class="dropdown-wrapper" id="dd-module">
                    <label class="form-label text-muted mb-1 small">Module</label>
                    <button type="button" class="custom-multiselect-btn trigger-btn" disabled>
                        <span class="selected-text">Select Item(s)</span><i class="bi bi-chevron-down ms-2"></i>
                    </button>
                    <div class="custom-multiselect-menu">
                        <div class="multiselect-header-bar">
                            <div class="header-actions"><span class="header-action-btn btn-check-all"><i class="bi bi-check-lg"></i> Check all</span><span class="header-action-btn btn-uncheck-all"><i class="bi bi-x-lg"></i> Uncheck all</span></div><i class="bi bi-x-circle-fill close-dropdown-btn"></i>
                        </div>
                        <div class="dynamic-container"></div>
                    </div>
                </div>
            </div>

            <div class="col-md">
                <div class="dropdown-wrapper" id="dd-activity">
                    <label class="form-label text-muted mb-1 small">Activity</label>
                    <button type="button" class="custom-multiselect-btn trigger-btn">
                        <span class="selected-text">Select options</span><i class="bi bi-chevron-down ms-2"></i>
                    </button>
                    <div class="custom-multiselect-menu">
                        <div class="multiselect-header-bar">
                            <div class="header-actions"><span class="header-action-btn btn-check-all"><i class="bi bi-check-lg"></i> Check all</span><span class="header-action-btn btn-uncheck-all"><i class="bi bi-x-lg"></i> Uncheck all</span></div><i class="bi bi-x-circle-fill close-dropdown-btn"></i>
                        </div>
                        <div class="dynamic-container"><div class="p-3 text-center text-muted"><div class="spinner-border spinner-border-sm me-2"></div> Loading...</div></div>
                    </div>
                </div>
            </div>
        </div>

        <button id="btnSubmit" class="btn btn-secondary text-white border-0 shadow-sm px-4" style="background-color: #6a5981;">
            <i class="bi bi-download me-2"></i> Fetch Details
        </button>
        
        <hr class="mt-4 mb-4 text-muted">

        <div id="dashboardCardsContainer" class="row g-4">
            </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function () {
            
            // ==========================================
            // 1. DATA RENDERING ENGINE
            // ==========================================
            function renderDropdownData($wrapper, data) {
                let html = '';
                data.forEach(group => {
                    const displayStyle = group.isCollapsedByDefault ? 'style="display: none;"' : '';
                    const iconClass = group.isCollapsedByDefault ? 'bi-plus-circle-fill' : 'bi-dash-circle-fill';
                    const groupValAttr = group.groupValue ? `value="${group.groupValue}"` : '';

                    html += `
                    <div class="group-container" data-group-name="${group.groupName}">
                        <div class="group-header">
                            <label><input type="checkbox" class="form-check-input group-checkbox" ${groupValAttr}><span>All ${group.groupName}</span></label>
                            <i class="bi ${iconClass} collapse-toggle"></i>
                        </div>
                        <ul class="group-items" ${displayStyle}>`;

                    if (group.subGroups && group.subGroups.length > 0) {
                        group.subGroups.forEach(sub => {
                            html += `
                            <li class="subgroup-container pt-2 pb-1 border-bottom">
                                <label class="fw-bold text-dark ms-3 d-flex align-items-center gap-2" style="font-size: 0.85rem; cursor: pointer;">
                                    <input type="checkbox" class="form-check-input subgroup-checkbox">${sub.subGroupName}
                                </label>
                                <ul class="list-unstyled ms-4 mt-1 mb-2">`;
                            sub.items.forEach(item => {
                                html += `<li class="flat-item"><label><input type="checkbox" class="form-check-input item-checkbox" value="${item.value}">${item.label}</label></li>`;
                            });
                            html += `</ul></li>`;
                        });
                    } else if (group.items) {
                        group.items.forEach(item => {
                            html += `<li class="flat-item"><label><input type="checkbox" class="form-check-input item-checkbox" value="${item.value}">${item.label}</label></li>`;
                        });
                    }
                    html += `</ul></div>`;
                });

                $wrapper.find('.dynamic-container').html(html);
                $wrapper.find('.trigger-btn').prop('disabled', false);
                updateSelectedDisplayText($wrapper);
            }

            // ==========================================
            // 2. MOCK DATA FETCHERS
            // ==========================================
            function fetchBusinessGroups() {
                const data = [
                    { groupName: "Leads", isCollapsedByDefault: false, items: [{ value: "DEF", label: "DEF" }, { value: "GHI", label: "GHI" }] }
                ];
                renderDropdownData($('#dd-business-group'), data);
            }

            function fetchActivities() {
                const mockApiResponse = [
                    {
                        groupName: "LEADS", groupValue: "leads", isCollapsedByDefault: false,
                        items: [
                            { value: "CLP", label: "CLP" }, { value: "CLPBRE", label: "CLPBRE" },
                            { value: "CLP_DD", label: "CLP_DD" }, { value: "CRM", label: "CRM" }, 
                            { value: "RM", label: "RM" }, { value: "SBOSS", label: "SBOSS" }, { value: "IBG", label: "IBG" }
                        ]
                    },
                    {
                        groupName: "CRA/CUE/ESG/DR", groupValue: "cra", isCollapsedByDefault: true,
                        items: [
                            { value: "CRA", label: "CRA" }, { value: "CUE", label: "CUE" },
                            { value: "ESG", label: "ESG" }, { value: "DynamicReview", label: "Dynamic Review" }
                        ]
                    },
                    {
                        groupName: "PROPOSALS", groupValue: "proposals", isCollapsedByDefault: true,
                        items: [
                            { value: "BREDDSPDM", label: "BRE DDSPDM" }, { value: "BRECAFPDM", label: "BRE CAFPDM" },
                            { value: "CAFPM2New", label: "CAFPM2 (New)" }, { value: "DDSQV2New", label: "DDSQ V2 (New)" },
                            { value: "FormM", label: "Form M" }, { value: "RFMT", label: "RFMT" }, { value: "Others", label: "Others" }
                        ]
                    },
                    {
                        groupName: "CBS", groupValue: "cbs", isCollapsedByDefault: true,
                        subGroups: [
                            { subGroupName: "Account Opening", items: [{ value: "CCOD", label: "CC/OD" }] },
                            { subGroupName: "Disbursement", items: [{ value: "DLTC", label: "DLTC" }] }
                        ]
                    }
                ];
                renderDropdownData($('#dd-activity'), mockApiResponse);
            }

            fetchBusinessGroups();
            fetchActivities();


            // ==========================================
            // 3. UI DROPDOWN LOGIC
            // ==========================================
            function updateSelectedDisplayText($wrapper) {
                const checkedLabels = [];
                $wrapper.find('.item-checkbox:checked').each(function () { checkedLabels.push($(this).parent().text().trim()); });
                const $selectedText = $wrapper.find('.selected-text');
                if (checkedLabels.length === 0) $selectedText.text('Select options');
                else if (checkedLabels.length <= 2) $selectedText.text(checkedLabels.join(', '));
                else $selectedText.text(checkedLabels.slice(0, 2).join(', ') + `, +${checkedLabels.length - 2} more`);
            }

            function syncMainGroupCheckbox($container) {
                const totalItems = $container.find('.item-checkbox').length;
                const checkedItems = $container.find('.item-checkbox:checked').length;
                $container.find('.group-checkbox').prop('checked', totalItems === checkedItems && totalItems > 0);
            }

            $(document).on('click', '.trigger-btn', function (e) {
                e.stopPropagation();
                const $menu = $(this).siblings('.custom-multiselect-menu');
                $('.custom-multiselect-menu').not($menu).removeClass('show');
                $menu.toggleClass('show');
            });

            $(document).on('click', '.close-dropdown-btn', function () { $(this).closest('.custom-multiselect-menu').removeClass('show'); });
            $(document).on('click', function (e) { if (!$(e.target).closest('.dropdown-wrapper').length) $('.custom-multiselect-menu').removeClass('show'); });
            
            $(document).on('click', '.collapse-toggle', function (e) {
                e.stopPropagation();
                const $icon = $(this);
                const $itemsList = $icon.closest('.group-container').find('.group-items');
                $itemsList.slideToggle(150, function () {
                    if ($itemsList.is(':visible')) $icon.removeClass('bi-plus-circle-fill').addClass('bi-dash-circle-fill');
                    else $icon.removeClass('bi-dash-circle-fill').addClass('bi-plus-circle-fill');
                });
            });

            $(document).on('click', '.btn-check-all', function () {
                const $wrapper = $(this).closest('.dropdown-wrapper');
                $wrapper.find('input[type="checkbox"]').prop('checked', true);
                updateSelectedDisplayText($wrapper);
            });

            $(document).on('click', '.btn-uncheck-all', function () {
                const $wrapper = $(this).closest('.dropdown-wrapper');
                $wrapper.find('input[type="checkbox"]').prop('checked', false);
                updateSelectedDisplayText($wrapper);
            });

            $(document).on('change', '.group-checkbox', function () {
                $(this).closest('.group-container').find('.item-checkbox, .subgroup-checkbox').prop('checked', $(this).is(':checked'));
                updateSelectedDisplayText($(this).closest('.dropdown-wrapper'));
            });

            $(document).on('change', '.subgroup-checkbox', function () {
                $(this).closest('.subgroup-container').find('.item-checkbox').prop('checked', $(this).is(':checked'));
                syncMainGroupCheckbox($(this).closest('.group-container'));
                updateSelectedDisplayText($(this).closest('.dropdown-wrapper'));
            });

            $(document).on('change', '.item-checkbox', function () {
                const $subContainer = $(this).closest('.subgroup-container');
                if ($subContainer.length > 0) {
                    const totalSub = $subContainer.find('.item-checkbox').length;
                    const checkedSub = $subContainer.find('.item-checkbox:checked').length;
                    $subContainer.find('.subgroup-checkbox').prop('checked', totalSub === checkedSub && totalSub > 0);
                }
                syncMainGroupCheckbox($(this).closest('.group-container'));
                updateSelectedDisplayText($(this).closest('.dropdown-wrapper'));
            });


            // ==========================================
            // 4. MOCK API FOR STATS (Created & Approved)
            // ==========================================
            const mockStatsData = {
                // LEADS
                "CLP": { 
                    created: { count: 7569, amount: 97739 }, 
                    approved: { count: 4210, amount: 55420 } 
                },
                "CLPBRE": { 
                    created: { count: 10357, amount: 28919 }, 
                    approved: { count: 8500, amount: 21000 } 
                },
                "CLP_DD": { 
                    created: { count: 9168, amount: 49155 }, 
                    approved: { count: 6020, amount: 31000 } 
                },
                "CRM": { 
                    created: { count: 12545, amount: 75415 }, 
                    approved: { count: 10000, amount: 62000 } 
                },
                "RM": { 
                    created: { count: 4481, amount: 44419 }, 
                    approved: { count: 3200, amount: 38000 } 
                },
                "SBOSS": { 
                    created: { count: 8082, amount: 127438 }, 
                    approved: { count: 5010, amount: 80500 } 
                },
                "IBG": { 
                    created: { count: 9576, amount: 117729 }, 
                    approved: { count: 7100, amount: 98000 } 
                },
                
                // CRA/CUE/ESG/DR (Count only)
                "CRA": { 
                    created: { count: 23648 }, 
                    approved: { count: 18400 } 
                },
                "CUE": { 
                    created: { count: 13409 }, 
                    approved: { count: 9200 } 
                },
                "ESG": { 
                    created: { count: 24327 }, 
                    approved: { count: 21000 } 
                },
                "DynamicReview": { 
                    created: { count: 6460 }, 
                    approved: { count: 5000 } 
                },
                
                // PROPOSALS
                "BREDDSPDM": { 
                    created: { count: 6826, amount: 74094 }, 
                    approved: { count: 4000, amount: 45000 } 
                },
                "BRECAFPDM": { 
                    created: { count: 14483, amount: 147877 }, 
                    approved: { count: 11000, amount: 120000 } 
                },
                "CAFPM2New": { 
                    created: { count: 3621, amount: 13428 }, 
                    approved: { count: 2100, amount: 9500 } 
                },
                "DDSQV2New": { 
                    created: { count: 24323, amount: 119657 }, 
                    approved: { count: 19000, amount: 95000 } 
                },
                "FormM": { 
                    created: { count: 11220, amount: 47580 }, 
                    approved: { count: 8000, amount: 35000 } 
                },
                "RFMT": { 
                    created: { count: 13662, amount: 137335 }, 
                    approved: { count: 10500, amount: 110000 } 
                },
                "Others": { 
                    created: { count: 16715, amount: 11289 }, 
                    approved: { count: 14000, amount: 9000 } 
                },

                // DEFAULT FALLBACK FOR ANY OTHERS (e.g. CBS Items)
                "default": { 
                    created: { count: 1234, amount: 5678 },
                    approved: { count: 900, amount: 4000 }
                }
            };

            const formatNumber = (num) => {
                if(!num) return '0';
                return num.toLocaleString('en-IN');
            };

            const cardThemes = {
                "LEADS": { themeClass: "theme-blue", icon: "bi-people-fill", hasAmount: true },
                "CRA/CUE/ESG/DR": { themeClass: "theme-purple", icon: "bi-bar-chart-fill", hasAmount: false },
                "PROPOSALS": { themeClass: "theme-orange", icon: "bi-file-earmark-text-fill", hasAmount: true },
                "CBS": { themeClass: "theme-dark", icon: "bi-bank2", hasAmount: true }
            };


            // ==========================================
            // 5. RENDER SPECIFIC TABLE BASED ON TAB
            // ==========================================
            function renderCardTable($card, status) {
                const groupName = $card.data('group');
                const items = $card.data('items'); 
                const themeConfig = cardThemes[groupName] || { themeClass: "theme-dark", icon: "bi-record-circle", hasAmount: true };

                let totalCount = 0;
                let totalAmount = 0;
                let tableRowsHtml = '';

                // Build Table Rows dynamically based on the 'status' (created or approved)
                items.forEach(item => {
                    // Fallback to 'default' if item value isn't explicitly in our mockData
                    const allStats = mockStatsData[item.value] || mockStatsData['default'];
                    const currentStats = allStats[status]; 

                    totalCount += currentStats.count;
                    
                    tableRowsHtml += `<tr><td>${item.label}</td><td>${formatNumber(currentStats.count)}</td>`;
                    
                    if (themeConfig.hasAmount) {
                        totalAmount += (currentStats.amount || 0);
                        tableRowsHtml += `<td>${formatNumber(currentStats.amount || 0)}</td>`;
                    }
                    tableRowsHtml += `</tr>`;
                });

                // Inject Body
                $card.find('tbody').html(tableRowsHtml);
                
                // Inject Footer Totals
                let tfootHtml = `<tr><td>TOTAL</td><td>${formatNumber(totalCount)}</td>`;
                if (themeConfig.hasAmount) {
                    tfootHtml += `<td>${formatNumber(totalAmount)}</td>`;
                }
                tfootHtml += `</tr>`;
                
                $card.find('tfoot').html(tfootHtml);
            }


            // ==========================================
            // 6. GENERATE CARDS ON SUBMIT
            // ==========================================
            $('#btnSubmit').on('click', function() {
                const $cardsContainer = $('#dashboardCardsContainer');
                $cardsContainer.empty(); // Clear previous cards

                let hasData = false;

                // Loop through each Group in the Activity Dropdown
                $('#dd-activity .group-container').each(function() {
                    const groupName = $(this).attr('data-group-name');
                    const checkedItems = [];
                    
                    $(this).find('.item-checkbox:checked').each(function() {
                        checkedItems.push({
                            value: $(this).val(),
                            label: $(this).parent().text().trim()
                        });
                    });

                    // If items are selected in this group, generate a card
                    if (checkedItems.length > 0) {
                        hasData = true;
                        const themeConfig = cardThemes[groupName] || { themeClass: "theme-dark", icon: "bi-record-circle", hasAmount: true };
                        
                        // Create Card Elements using jQuery (this allows us to attach data securely)
                        const $cardWrapper = $(`<div class="col-lg-4 col-md-6"></div>`);
                        const $card = $(`
                            <div class="dash-card ${themeConfig.themeClass}">
                                <div class="dash-card-header">
                                    <i class="bi ${themeConfig.icon}"></i> ${groupName}
                                </div>
                                <div class="dash-toggle-container">
                                    <button class="dash-toggle-btn active" data-status="created">Created</button>
                                    <button class="dash-toggle-btn" data-status="approved">Approved</button>
                                </div>
                                <table class="dash-table">
                                    <thead>
                                        <tr>
                                            <th>Module / Source</th>
                                            <th>Count</th>
                                            ${themeConfig.hasAmount ? '<th>Amount (in Cr.)</th>' : ''}
                                        </tr>
                                    </thead>
                                    <tbody></tbody>
                                    <tfoot></tfoot>
                                </table>
                            </div>
                        `);

                        // Attach specific data to this card instance so tabs know what to render
                        $card.data('group', groupName);
                        $card.data('items', checkedItems);

                        // Initial Render for 'Created' Tab
                        renderCardTable($card, 'created');

                        // Append to DOM
                        $cardWrapper.append($card);
                        $cardsContainer.append($cardWrapper);
                    }
                });

                if (!hasData) {
                    $cardsContainer.html(`<div class="col-12 text-center text-danger mt-4">Please select options from the Activity dropdown to view data.</div>`);
                }
            });

            // ==========================================
            // 7. TAB CLICK LISTENER (Created / Approved)
            // ==========================================
            $(document).on('click', '.dash-toggle-btn', function() {
                const $btn = $(this);
                const $card = $btn.closest('.dash-card');
                
                // Toggle active styling
                $card.find('.dash-toggle-btn').removeClass('active');
                $btn.addClass('active');

                // Read desired status and re-render table inside that specific card
                const status = $btn.data('status'); 
                renderCardTable($card, status);
            });

        });
    </script>
</body>
</html>
